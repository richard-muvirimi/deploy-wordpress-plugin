name: Release

# Creates a tag and GitHub release from the bpkg.json version when it changes on the release branch
on:
  push:
    branches: [ "release" ]
    paths: [ "bpkg.json" ]

  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION=$(jq -r '.version // empty' bpkg.json)

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error file=bpkg.json::Invalid version '$VERSION', expected MAJOR.MINOR.PATCH"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$VERSION" > /dev/null; then
            echo "::notice::Tag $VERSION already exists, skipping"
            echo "create=false" >> "$GITHUB_OUTPUT"
          else
            echo "create=true" >> "$GITHUB_OUTPUT"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run tests
        if: steps.version.outputs.create == 'true'
        run: bash tests.sh

      - name: Create release
        if: steps.version.outputs.create == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          #versions with a suffix, e.g. 2.2.0-beta.1, are pre-releases
          PRERELEASE=""
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="--prerelease"
          fi

          #creates the tag on this commit, source archives are attached by GitHub
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes $PRERELEASE

          echo "::notice::Released $VERSION"
